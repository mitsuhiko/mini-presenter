<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f5562'/%3E%3Crect x='7' y='8' width='18' height='12.5' rx='2' fill='none' stroke='%23d5a877' stroke-width='2.5'/%3E%3Cpath d='M12 25h8' stroke='%23d5a877' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E" />
    <meta name="robots" content="noindex" />
    <title>Presenter access · mini-presenter</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body>
    <main class="page-center">
      <div class="card auth">
        <div class="auth__logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="4" width="18" height="12" rx="2" />
            <path d="M8 20h8M12 16v4" />
          </svg>
          mini-presenter
        </div>
        <h1>Presenter access</h1>
        <div class="message" data-level="{{LEVEL}}" role="status"><strong>{{MESSAGE}}</strong>{{DETAIL}}</div>
        <form action="/_/presenter" method="post">
          <label class="muted" for="key">Presenter PIN</label>
          <input
            class="input"
            id="key"
            name="key"
            type="password"
            inputmode="numeric"
            autocomplete="one-time-code"
            maxlength="12"
            required
            autofocus
            {{DISABLED}}
          />
          <button class="btn btn--primary btn--lg" type="submit" {{DISABLED}}>Continue</button>
        </form>
      </div>
    </main>
  </body>
</html>
